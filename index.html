<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b2417">
<title>Snake</title>
<style>
  :root {
    --bg: #0b2417;
    --panel: #1b4a32;
    --panel-dark: #0f2f1f;
    --text: #f6fbef;
    --muted: #b4d2bc;
    --accent: #ffd23f;
    --accent-dark: #c9930a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    color: var(--text);
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  body {
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1.5px, transparent 2px) 0 0 / 26px 26px,
      radial-gradient(ellipse at 50% 30%, #1d5a3a 0%, #0b2417 70%);
  }
  #app {
    height: 100dvh; width: 100vw;
    display: flex; flex-direction: column; align-items: center;
    padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
    gap: 12px;
  }
  header {
    width: 100%; max-width: 900px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .stat {
    background: linear-gradient(#22593d, #17412c);
    border-radius: 16px;
    padding: 8px 18px; min-width: 116px; text-align: center;
    box-shadow: 0 4px 0 var(--panel-dark), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .stat small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .5px; }
  .stat b { display: inline-block; font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .stat b.pop { animation: pop .3s ease-out; }
  @keyframes pop { 40% { transform: scale(1.5); color: var(--accent); } }
  button {
    font: inherit; color: var(--text); border: 0; cursor: pointer;
    background: linear-gradient(#22593d, #17412c);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--panel-dark), inset 0 1px 0 rgba(255,255,255,.14);
    transition: transform .06s, box-shadow .06s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--panel-dark); }
  #pauseBtn { width: 58px; height: 58px; font-size: 24px; }
  #stage {
    flex: 1; width: 100%; min-height: 0;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  canvas {
    border-radius: 14px;
    display: block;
    box-shadow: 0 0 0 6px #8a5a2f, 0 0 0 9px #55351a, 0 14px 36px rgba(0,0,0,.55);
  }
  #overlay {
    position: absolute;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,28,18,.72);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    border-radius: 14px;
  }
  #overlay.hidden { display: none; }
  .card {
    background: linear-gradient(#22593d, #163c29);
    border-radius: 24px;
    padding: 22px 26px; text-align: center; max-width: 440px; width: 92%;
    max-height: 96%; overflow: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
    animation: cardIn .25s ease-out;
  }
  @keyframes cardIn { from { transform: scale(.85); opacity: 0; } }
  .card h1 {
    margin: 0 0 4px; font-size: 46px; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 3px 0 rgba(0,0,0,.3);
  }
  .card h1 span {
    background: linear-gradient(90deg, #ffe45c, #7ee06a, #5cc8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: none;
  }
  .card p { margin: 6px 0 14px; color: var(--muted); font-size: 17px; line-height: 1.4; }
  .row { display: flex; gap: 10px; justify-content: center; margin-bottom: 14px; }
  .row button {
    flex: 1; padding: 11px 6px; font-size: 16px; font-weight: 600;
    background: var(--panel-dark); border: 3px solid transparent;
  }
  .row button.on { border-color: var(--accent); }
  #skins button { height: 46px; padding: 0; }
  #skins [data-skin="blau"] { background: linear-gradient(90deg, #3b82f6, #2563eb); }
  #skins [data-skin="gruen"] { background: linear-gradient(90deg, #4ccf58, #2ea13a); }
  #skins [data-skin="feuer"] { background: linear-gradient(90deg, #ffd43b, #ff8a1f, #e5261f); }
  #skins [data-skin="regenbogen"] { background: linear-gradient(90deg, #ff4d4d, #ffb03b, #f4f43b, #4cd964, #38b6ff, #a05cff); }
  #startBtn {
    width: 100%; padding: 15px; font-size: 24px; font-weight: 800;
    background: linear-gradient(#ffe066, #ffc21a); color: #3a2a00;
    box-shadow: 0 5px 0 var(--accent-dark), inset 0 1px 0 rgba(255,255,255,.6);
  }
  #startBtn:active { box-shadow: 0 1px 0 var(--accent-dark); }
  .opt { margin-top: 14px; font-size: 16px; color: var(--muted); }
  .opt label { display: inline-flex; align-items: center; gap: 8px; }
  .opt input { width: 22px; height: 22px; accent-color: var(--accent); }
  #pad {
    display: grid;
    grid-template-columns: repeat(3, 78px);
    grid-template-rows: repeat(2, 68px);
    gap: 9px;
  }
  #pad button { font-size: 30px; }
  #pad .up { grid-column: 2; grid-row: 1; }
  #pad .left { grid-column: 1; grid-row: 2; }
  #pad .down { grid-column: 2; grid-row: 2; }
  #pad .right { grid-column: 3; grid-row: 2; }
  @media (orientation: landscape) {
    #app { flex-direction: row; }
    header { flex-direction: column; width: auto; align-self: center; }
    #stage { height: 100%; width: auto; }
    #pad { align-self: center; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="stat"><small>PUNKTE</small><b id="score">0</b></div>
    <button id="pauseBtn" aria-label="Pause">⏸</button>
    <div class="stat"><small>REKORD</small><b id="best">0</b></div>
  </header>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="overlay">
      <div class="card">
        <h1 id="ovTitle">🐍 <span>SNAKE</span></h1>
        <p id="ovText">Wische über den Bildschirm oder benutze die Pfeile. Friss das Obst und beiß dich nicht selbst!</p>
        <div class="row" id="levels">
          <button data-ms="190">🐢 Gemütlich</button>
          <button data-ms="140" class="on">🐍 Normal</button>
          <button data-ms="95">🚀 Schnell</button>
        </div>
        <div class="row" id="skins">
          <button data-skin="blau" class="on" aria-label="Blaue Schlange"></button>
          <button data-skin="gruen" aria-label="Grüne Schlange"></button>
          <button data-skin="feuer" aria-label="Feuerschlange"></button>
          <button data-skin="regenbogen" aria-label="Regenbogenschlange"></button>
        </div>
        <button id="startBtn">Los geht's!</button>
        <div class="opt">
          <label><input type="checkbox" id="wrap"> Durch Wände gehen</label>
        </div>
      </div>
    </div>
  </div>

  <div id="pad">
    <button class="up" data-d="0,-1" aria-label="Hoch">▲</button>
    <button class="left" data-d="-1,0" aria-label="Links">◀</button>
    <button class="down" data-d="0,1" aria-label="Runter">▼</button>
    <button class="right" data-d="1,0" aria-label="Rechts">▶</button>
  </div>
</div>

<script>
(() => {
  const COLS = 17, ROWS = 17;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const wrapEl = document.getElementById('wrap');
  const FRUITS = [
    {e: '🍎', c: '#ff4d4d'}, {e: '🍓', c: '#ff3b6b'}, {e: '🍒', c: '#e5263a'},
    {e: '🍌', c: '#ffd93b'}, {e: '🍇', c: '#a05cff'}, {e: '🍉', c: '#4cd964'},
    {e: '🍊', c: '#ff9d2e'}
  ];
  const TITLE = '🐍 <span>SNAKE</span>';

  let cell = 20, boardPx = 340;
  let bg = null; // vorgerendertes Spielfeld
  let snake, prev, dir, queue, food, fruit, foodBorn = 0, score;
  let stepMs = 140, baseMs = 140, skin = 'blau';
  let state = 'menu'; // menu | run | pause | over
  let last = 0, acc = 0, deadAt = 0, shake = 0;
  let particles = [], floats = [];

  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem(key);
      localStorage.setItem(key, val);
    } catch (e) { return null; }
  }
  let best = parseInt(store('snake-best') || '0', 10) || 0;
  bestEl.textContent = best;

  // ---------- Aussehen der Schlange ----------
  function skinColor(i, n, now) {
    const k = Math.floor(i);
    switch (skin) {
      case 'gruen': return k % 2 ? '#2ea13a' : '#4ccf58';
      case 'feuer': return 'hsl(' + (50 - 48 * Math.min(1, i / Math.max(6, n))) + ',100%,54%)';
      case 'regenbogen': return 'hsl(' + ((i * 32 - now / 10) % 360 + 360) % 360 + ',95%,58%)';
      default: return k % 2 ? '#2563eb' : '#3b82f6';
    }
  }

  // ---------- Spielfeld einmal vorzeichnen ----------
  function buildBoard() {
    bg = document.createElement('canvas');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    bg.width = boardPx * dpr; bg.height = boardPx * dpr;
    const g = bg.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++) {
        g.fillStyle = (x + y) % 2 ? '#a6d957' : '#9ad04c';
        g.fillRect(x * cell, y * cell, cell, cell);
      }
    // fester Zufall, damit die Deko bei jedem Neuzeichnen gleich bleibt
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    g.lineCap = 'round';
    for (let i = 0; i < 26; i++) {
      const x = rnd() * boardPx, y = rnd() * boardPx, s = cell * (0.12 + rnd() * 0.1);
      g.strokeStyle = 'rgba(60,130,40,.55)';
      g.lineWidth = Math.max(1, cell * 0.05);
      g.beginPath();
      g.moveTo(x, y); g.lineTo(x - s * 0.6, y - s);
      g.moveTo(x, y); g.lineTo(x, y - s * 1.3);
      g.moveTo(x, y); g.lineTo(x + s * 0.6, y - s);
      g.stroke();
    }
    const petals = ['#ffffff', '#ffe36e', '#ffb3d1'];
    for (let i = 0; i < 9; i++) {
      const x = rnd() * boardPx, y = rnd() * boardPx, r = cell * 0.07;
      g.fillStyle = petals[i % 3];
      for (let p = 0; p < 5; p++) {
        const a = p * Math.PI * 2 / 5;
        g.beginPath(); g.arc(x + Math.cos(a) * r * 1.3, y + Math.sin(a) * r * 1.3, r, 0, 7); g.fill();
      }
      g.fillStyle = '#ff9d2e';
      g.beginPath(); g.arc(x, y, r * 0.9, 0, 7); g.fill();
    }
    const v = g.createRadialGradient(boardPx / 2, boardPx / 2, boardPx * 0.35, boardPx / 2, boardPx / 2, boardPx * 0.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,40,10,.28)');
    g.fillStyle = v; g.fillRect(0, 0, boardPx, boardPx);
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    const size = Math.floor(Math.min(r.width, r.height)) - 20;
    cell = Math.max(8, Math.floor(size / COLS));
    boardPx = cell * COLS;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.style.width = boardPx + 'px';
    canvas.style.height = boardPx + 'px';
    canvas.width = boardPx * dpr;
    canvas.height = boardPx * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    overlay.style.width = (boardPx + 2) + 'px';
    overlay.style.height = (boardPx + 2) + 'px';
    buildBoard();
    draw(performance.now(), 0);
  }

  // ---------- Spiellogik ----------
  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{x: cx, y: cy}, {x: cx - 1, y: cy}, {x: cx - 2, y: cy}];
    prev = snake.slice();
    dir = {x: 1, y: 0};
    queue = [];
    score = 0;
    stepMs = baseMs;
    particles = []; floats = [];
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++)
      for (let x = 0; x < COLS; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({x, y});
    if (!free.length) { food = null; return; }
    food = free[Math.floor(Math.random() * free.length)];
    fruit = FRUITS[Math.floor(Math.random() * FRUITS.length)];
    foodBorn = performance.now();
  }

  function turn(x, y) {
    if (state !== 'run') return;
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (lastDir.x === x && lastDir.y === y) return;
    if (lastDir.x === -x && lastDir.y === -y) return; // keine 180°-Wende
    if (queue.length < 2) queue.push({x, y});
  }

  function burst(px, py, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, v = speed * (0.4 + Math.random() * 0.6);
      particles.push({
        x: px, y: py, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3,
        life: 0, max: 380 + Math.random() * 320,
        color: Math.random() < 0.3 ? '#ffffff' : color,
        size: cell * (0.07 + Math.random() * 0.09)
      });
    }
  }

  function step() {
    if (queue.length) dir = queue.shift();
    let nx = snake[0].x + dir.x, ny = snake[0].y + dir.y;
    if (wrapEl.checked) {
      nx = (nx + COLS) % COLS; ny = (ny + ROWS) % ROWS;
    } else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      return gameOver();
    }
    const eating = food && nx === food.x && ny === food.y;
    const body = eating ? snake : snake.slice(0, -1); // Schwanz rückt weg
    if (body.some(s => s.x === nx && s.y === ny)) return gameOver();
    const old = snake;
    const next = [{x: nx, y: ny}].concat(old);
    if (!eating) next.pop();
    prev = next.map((_, i) => old[Math.min(i, old.length - 1)]);
    snake = next;
    if (eating) {
      score++;
      scoreEl.textContent = score;
      scoreEl.classList.remove('pop'); void scoreEl.offsetWidth; scoreEl.classList.add('pop');
      if (navigator.vibrate) navigator.vibrate(25);
      const px = (nx + 0.5) * cell, py = (ny + 0.5) * cell;
      burst(px, py, fruit.c, 16, cell * 0.011);
      floats.push({x: px, y: py, life: 0, text: '+1'});
      stepMs = Math.max(60, baseMs - Math.floor(score / 5) * 6);
      placeFood();
      if (!food) return gameOver(true);
    }
  }

  function gameOver(won) {
    state = 'over';
    deadAt = performance.now();
    if (!won) {
      shake = 420;
      burst((snake[0].x + 0.5) * cell, (snake[0].y + 0.5) * cell, '#ff5a4d', 26, cell * 0.014);
    }
    if (navigator.vibrate) navigator.vibrate([80, 60, 120]);
    const record = score > best;
    if (record) { best = score; store('snake-best', String(best)); bestEl.textContent = best; }
    setTimeout(() => {
      if (state !== 'over') return;
      ovTitle.textContent = won ? '🏆 Gewonnen!' : (record ? '🎉 Neuer Rekord!' : '💥 Autsch!');
      ovText.textContent = 'Du hast ' + score + (score === 1 ? ' Punkt' : ' Punkte') + ' geschafft.' +
        (record ? ' Das ist dein bestes Spiel bisher!' : ' Dein Rekord: ' + best + '.');
      startBtn.textContent = 'Nochmal!';
      overlay.classList.remove('hidden');
    }, won ? 200 : 750);
  }

  // ---------- Zeichnen ----------
  function drawSnake(now, t) {
    const n = snake.length, dead = state === 'over';
    // Weg der Schlange: Zwischenpositionen plus Eckpunkte, damit Kurven sauber bleiben
    const pts = [];
    for (let i = 0; i < n; i++) {
      const c = snake[i], p = prev[i] || c;
      const jump = Math.abs(c.x - p.x) + Math.abs(c.y - p.y) > 1; // durch die Wand
      const fx = jump ? c.x : p.x + (c.x - p.x) * t, fy = jump ? c.y : p.y + (c.y - p.y) * t;
      pts.push({x: (fx + 0.5) * cell, y: (fy + 0.5) * cell, i});
      if (i + 1 < n) pts.push({x: (snake[i + 1].x + 0.5) * cell, y: (snake[i + 1].y + 0.5) * cell, i: i + 0.5});
    }
    const W = cell * 0.74;
    const width = i => W * Math.max(0.5, Math.min(1, (n - 0.5 - i) / 3 + 0.35));
    const flash = dead && now - deadAt < 600 && Math.floor((now - deadAt) / 90) % 2 === 0;
    ctx.lineCap = 'round';

    const pass = (extra, scale, colorOf) => {
      for (let k = pts.length - 1; k >= 1; k--) {
        const a = pts[k], b = pts[k - 1];
        if (Math.abs(a.x - b.x) + Math.abs(a.y - b.y) > cell * 1.5) continue;
        ctx.strokeStyle = colorOf(b.i);
        ctx.lineWidth = width(b.i) * scale + extra;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
      }
    };
    // Schatten, Umriss, Farbe, Glanz
    ctx.save(); ctx.translate(0, cell * 0.12);
    pass(cell * 0.1, 1, () => 'rgba(0,50,10,.22)');
    ctx.restore();
    pass(cell * 0.16, 1, () => 'rgba(10,30,40,.75)');
    pass(0, 1, i => flash ? '#ffffff' : skinColor(i, n, now));
    ctx.save(); ctx.translate(-cell * 0.07, -cell * 0.09);
    pass(0, 0.26, () => 'rgba(255,255,255,.3)');
    ctx.restore();

    // Kopf
    const h = pts[0], R = cell * 0.46;
    const ang = Math.atan2(dir.y, dir.x);
    ctx.save();
    ctx.translate(h.x, h.y); ctx.rotate(ang);
    // Zunge
    if (!dead && now % 1700 < 280) {
      const L = R + cell * (0.18 + 0.14 * Math.sin((now % 1700) / 280 * Math.PI));
      ctx.strokeStyle = '#ff3b5c'; ctx.lineWidth = Math.max(1.5, cell * 0.07);
      ctx.beginPath();
      ctx.moveTo(R * 0.8, 0); ctx.lineTo(L, 0);
      ctx.moveTo(L, 0); ctx.lineTo(L + cell * 0.12, -cell * 0.1);
      ctx.moveTo(L, 0); ctx.lineTo(L + cell * 0.12, cell * 0.1);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(10,30,40,.75)';
    ctx.beginPath(); ctx.ellipse(0, 0, R + cell * 0.08, R * 0.92 + cell * 0.08, 0, 0, 7); ctx.fill();
    ctx.fillStyle = flash ? '#ffffff' : skinColor(0, n, now);
    ctx.beginPath(); ctx.ellipse(0, 0, R, R * 0.92, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.ellipse(-R * 0.15, -R * 0.4, R * 0.5, R * 0.22, 0, 0, 7); ctx.fill();
    // Augen
    const ex = R * 0.25, ey = R * 0.5, er = R * 0.36;
    for (const s of [-1, 1]) {
      if (dead) {
        ctx.strokeStyle = '#1b1b1b'; ctx.lineWidth = Math.max(1.5, cell * 0.08);
        const d = er * 0.7;
        ctx.beginPath();
        ctx.moveTo(ex - d, s * ey - d); ctx.lineTo(ex + d, s * ey + d);
        ctx.moveTo(ex + d, s * ey - d); ctx.lineTo(ex - d, s * ey + d);
        ctx.stroke();
        continue;
      }
      const blink = now % 3600 < 130;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.ellipse(ex, s * ey, er, blink ? er * 0.12 : er, 0, 0, 7); ctx.fill();
      if (!blink) {
        ctx.fillStyle = '#16202a';
        ctx.beginPath(); ctx.arc(ex + er * 0.3, s * ey, er * 0.55, 0, 7); ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex + er * 0.45, s * ey - er * 0.25, er * 0.18, 0, 7); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawFood(now) {
    const x = (food.x + 0.5) * cell, y = (food.y + 0.5) * cell;
    const age = now - foodBorn;
    const k = Math.min(1, age / 260);
    const popIn = 1 + 0.5 * Math.sin(k * Math.PI) * (1 - k) - (1 - k) * (1 - k); // kleiner Hüpfer beim Erscheinen
    const bob = Math.sin(now / 280);
    const glow = ctx.createRadialGradient(x, y, 0, x, y, cell * 0.95);
    glow.addColorStop(0, 'rgba(255,255,220,.55)'); glow.addColorStop(1, 'rgba(255,255,220,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(x, y, cell * 0.95, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(0,50,10,.25)';
    ctx.beginPath(); ctx.ellipse(x, y + cell * 0.36, cell * (0.3 - 0.03 * bob), cell * 0.09, 0, 0, 7); ctx.fill();
    ctx.save();
    ctx.translate(x, y - cell * 0.06 * bob - cell * 0.03);
    const s = Math.max(0.05, popIn) * (1 + 0.05 * bob);
    ctx.scale(s, s);
    ctx.font = Math.floor(cell * 0.82) + 'px serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#000';
    ctx.fillText(fruit.e, 0, cell * 0.05);
    ctx.restore();
  }

  function drawEffects(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.max) { particles.splice(i, 1); continue; }
      p.vy += cell * 0.00003 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.life += dt;
      if (f.life >= 700) { floats.splice(i, 1); continue; }
      const k = f.life / 700;
      ctx.globalAlpha = 1 - k * k;
      ctx.font = '800 ' + Math.floor(cell * 0.7) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(2, cell * 0.12); ctx.strokeStyle = 'rgba(20,50,20,.8)';
      ctx.strokeText(f.text, f.x, f.y - cell * 1.1 * k - cell * 0.4);
      ctx.fillStyle = '#fff36b';
      ctx.fillText(f.text, f.x, f.y - cell * 1.1 * k - cell * 0.4);
    }
    ctx.globalAlpha = 1;
  }

  function draw(now, dt) {
    if (!bg) return;
    ctx.save();
    if (shake > 0) {
      const a = cell * 0.25 * (shake / 420);
      ctx.translate((Math.random() - 0.5) * a * 2, (Math.random() - 0.5) * a * 2);
      shake -= dt;
    }
    ctx.drawImage(bg, 0, 0, boardPx, boardPx);
    if (snake) {
      const t = (state === 'run' || state === 'pause') ? Math.min(1, acc / stepMs) : 1;
      if (food) drawFood(now);
      drawSnake(now, t);
      drawEffects(dt);
    }
    ctx.restore();
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const dt = Math.min(250, now - last); last = now;
    if (state === 'run') {
      acc += dt;
      while (acc >= stepMs && state === 'run') { acc -= stepMs; step(); }
    }
    draw(now, dt);
  }

  // ---------- Bedienung ----------
  function start() {
    reset();
    acc = 0;
    state = 'run';
    pauseBtn.textContent = '⏸';
    overlay.classList.add('hidden');
  }

  function togglePause() {
    if (state === 'run') {
      state = 'pause';
      pauseBtn.textContent = '▶';
      ovTitle.textContent = '⏸ Pause';
      ovText.textContent = 'Tippe auf „Weiter", wenn du bereit bist.';
      startBtn.textContent = 'Weiter';
      overlay.classList.remove('hidden');
    } else if (state === 'pause') {
      resume();
    }
  }
  function resume() {
    state = 'run';
    pauseBtn.textContent = '⏸';
    overlay.classList.add('hidden');
  }

  startBtn.addEventListener('click', () => state === 'pause' ? resume() : start());
  pauseBtn.addEventListener('click', togglePause);

  function pick(groupId, attr, value) {
    let found = false;
    document.querySelectorAll('#' + groupId + ' button').forEach(b => {
      const on = b.dataset[attr] === String(value);
      b.classList.toggle('on', on);
      if (on) found = true;
    });
    return found;
  }
  document.querySelectorAll('#levels button').forEach(btn => {
    btn.addEventListener('click', () => {
      baseMs = parseInt(btn.dataset.ms, 10);
      pick('levels', 'ms', baseMs);
      store('snake-speed', String(baseMs));
      if (state === 'pause') { // neue Geschwindigkeit gilt ab dem nächsten Spiel
        state = 'menu';
        ovTitle.innerHTML = TITLE;
        ovText.textContent = 'Neue Geschwindigkeit gewählt – das Spiel startet neu.';
        startBtn.textContent = "Los geht's!";
      }
    });
  });
  document.querySelectorAll('#skins button').forEach(btn => {
    btn.addEventListener('click', () => {
      skin = btn.dataset.skin;
      pick('skins', 'skin', skin);
      store('snake-skin', skin);
    });
  });
  const savedMs = parseInt(store('snake-speed') || '', 10);
  if (savedMs && pick('levels', 'ms', savedMs)) baseMs = savedMs; else pick('levels', 'ms', baseMs);
  const savedSkin = store('snake-skin');
  if (savedSkin && pick('skins', 'skin', savedSkin)) skin = savedSkin; else pick('skins', 'skin', skin);

  // Pfeiltasten auf dem Bildschirm
  document.querySelectorAll('#pad button').forEach(btn => {
    const [x, y] = btn.dataset.d.split(',').map(Number);
    btn.addEventListener('pointerdown', e => { e.preventDefault(); turn(x, y); });
  });

  // Wischen (reagiert schon während der Bewegung, nicht erst beim Loslassen)
  let sx = 0, sy = 0, tracking = false;
  stage.addEventListener('pointerdown', e => {
    if (e.target.closest('button, label, input')) return;
    tracking = true; sx = e.clientX; sy = e.clientY;
  });
  window.addEventListener('pointermove', e => {
    if (!tracking) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    const min = Math.max(18, cell * 0.6);
    if (Math.abs(dx) < min && Math.abs(dy) < min) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    sx = e.clientX; sy = e.clientY;
  });
  window.addEventListener('pointerup', () => tracking = false);
  window.addEventListener('pointercancel', () => tracking = false);
  document.addEventListener('touchmove', e => {
    if (!e.target.closest('.card')) e.preventDefault();
  }, {passive: false});

  // Tastatur (falls mal am PC gespielt wird)
  window.addEventListener('keydown', e => {
    const k = {ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
               w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]}[e.key];
    if (k) { e.preventDefault(); turn(k[0], k[1]); }
    else if (e.key === ' ' || e.key === 'p') { e.preventDefault(); togglePause(); }
    else if (e.key === 'Enter' && state !== 'run') { state === 'pause' ? resume() : start(); }
  });

  document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') togglePause(); });
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));

  reset();
  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
